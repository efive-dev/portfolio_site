<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="{{ '/#home' | relative_url }}" data-nav="home" aria-label="Edoardo Quinto, home">
      <img src="{{ '/assets/favicon.png' | relative_url }}" alt="" width="34" height="34">
      <span>Edoardo Quinto</span>
    </a>

    <nav class="nav" aria-label="Primary">
      <a href="{{ '/#home' | relative_url }}" data-nav="home">Home</a>
      <a href="{{ '/#about' | relative_url }}" data-nav="about">About</a>
      <a href="{{ '/#work' | relative_url }}" data-nav="work">Work</a>
      <a href="{{ '/#experience' | relative_url }}" data-nav="experience">Career</a>
      <a href="{{ '/blog/' | relative_url }}" data-nav="blog"{% if page.url contains '/blog/' %} aria-current="page"{% endif %}>Blog</a>
    </nav>

    <a class="btn btn-dark cta" href="{{ '/#contact' | relative_url }}" data-nav="contact">Say hello <span class="arrow">[ &rarr; ]</span></a>
    <button id="theme" type="button" class="theme" aria-label="Toggle day and night" aria-pressed="false"><span></span></button>
  </div>
</header>
