<!doctype html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>{% if page.layout == 'post' %}{{ page.title }} | {{ site.title }}{% else %}{{ page.title | default: site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ '/assets/favicon.png' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
  <script>
    /* theme + js flag before first paint (no flash) */
    (function () {
      var d = document.documentElement;
      d.classList.add('js');
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      d.setAttribute('data-theme', t === 'day' ? 'day' : 'night');
    })();
  </script>
</head>
<body data-base="{{ site.baseurl }}" class="layout-{{ page.layout }}{% if page.room %} room-page{% endif %}">
  <a class="skip" href="#main">Skip to content</a>
  {% include header.html %}

  <main id="main">
    {{ content }}
  </main>

  {% unless page.room %}{% include footer.html %}{% endunless %}

  {% if page.room %}
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="{{ '/js/app.js' | relative_url }}"></script>
  {% else %}
  <script src="{{ '/js/page.js' | relative_url }}" defer></script>
  {% endif %}
</body>
</html>
